<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Aucune ressource distante : seules les couvertures du dossier covers/ et le fichier data-casier.js sont lus (même site) -->

<title>Casier Macintosh — Casier Pédagogique Numérique</title>
<!--
  Projet : Casier V3 « Macintosh années 2000 »  ·  Version : 2.1.0  ·  Date : 21/11/2026
  Auteur : Tom Rougeaud  ·  Licence : CC BY-NC 4.0
  Réalisé avec l’aide de l’IA : Claude Sonnet 5.5 (Anthropic)
  Habillage rétro « années 2000 » (fenêtres arrondies, boutons ronds, dock, fond « hello ») du Casier Pédagogique Numérique.
  L’ancien habillage (fenêtres rayées) reste disponible dans le dossier classique/.
  Dessins et textes originaux : le fruit multicolore est une poire dessinée ici (aucun logo de marque) ; le « hello » utilise une police cursive du système.
-->
<style>
/* ===== SECTION : Variables et base ===== */
:root{--noir:#000;--blanc:#fff;--ardoise:#5a6a8a;--ardoise2:#7d8bab;
  --police:Geneva,Charcoal,"Lucida Grande",Verdana,sans-serif;
  --cursive:"Snell Roundhand","Apple Chancery","Brush Script MT","Segoe Script","Lucida Handwriting",cursive;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:12px var(--police);color:#000;user-select:none;-webkit-user-select:none;
  background:repeating-conic-gradient(var(--ardoise) 0 25%,var(--ardoise2) 0 50%) 0 0/2px 2px}
button{font:inherit;color:inherit;cursor:default}
[hidden]{display:none!important}
:focus-visible{outline:2px dotted #000;outline-offset:2px}

/* ===== SECTION : Barre de menus ===== */
#menus{position:fixed;left:0;right:0;top:0;height:24px;background:#fff;border-bottom:2px solid #000;display:flex;align-items:center;z-index:100000;padding:0 4px}
.mb{position:relative}
.mb>button{background:none;border:0;padding:3px 10px;min-height:22px;font-weight:bold}
.mb>button.ouvert{background:#000;color:#fff}
.mb>button.pomme{padding:2px 10px}
.liste{position:absolute;left:0;top:100%;min-width:200px;background:#fff;border:2px solid #000;box-shadow:2px 2px 0 #000;padding:1px 0}
.liste button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 16px}
.liste button:hover{background:#000;color:#fff}
.liste hr{margin:2px 0;border:0;border-top:1px solid #000}
#horloge{margin-left:auto;padding:0 10px;font-weight:bold}

/* ===== SECTION : Bureau et icônes ===== */
#bureau{position:absolute;left:0;right:0;top:24px;bottom:0;overflow:hidden}
.ico{width:132px;padding:4px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;line-height:1.2;min-height:100px}
.ico .lib{padding:1px 4px;background:#fff;border:1px solid transparent;word-break:break-word}
.ico.sel svg{filter:invert(1)}
.ico.sel .lib{background:#000;color:#fff}
.ico svg{display:block}
.fixe{position:absolute}
#disque{right:14px;top:12px}
#corbeille{right:14px;bottom:14px}

/* ===== SECTION : Fenêtres ===== */
.fen{position:absolute;background:#fff;border:2px solid #000;box-shadow:2px 2px 0 #000;display:flex;flex-direction:column;min-width:200px}
.fen.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
.tb{height:22px;border-bottom:2px solid #000;position:relative;display:flex;align-items:center;justify-content:center;flex:none;touch-action:none}
.tb .stries{position:absolute;left:24px;right:24px;top:4px;bottom:4px;display:none;
  background:repeating-linear-gradient(#000 0 1px,#fff 1px 3px)}
.fen.actif .tb .stries{display:block}
.tb .nom{position:relative;background:#fff;padding:0 10px;font-weight:bold;max-width:calc(100% - 70px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .case{position:absolute;top:3px;width:15px;height:15px;background:#fff;border:2px solid #000;padding:0;display:none}
.fen.actif .tb .case{display:block}
.tb .case.ferme{left:6px}
.tb .case.zoom{right:6px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3px #000}
.corps{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.infos{display:flex;justify-content:space-between;padding:3px 8px;border-bottom:2px solid #000;font-size:11px;flex:none}
.zone{flex:1;overflow:auto;padding:8px;background:#fff}
.vue-icones{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px}
.vue-liste{display:flex;flex-direction:column}
.vue-liste .ico{width:100%;flex-direction:row;justify-content:flex-start;text-align:left;min-height:24px;padding:1px 4px}
.vue-liste .ico .lib{flex:1;background:none}
.vue-liste .ico.sel .lib{background:none}
.vue-liste .ico.sel{background:#000;color:#fff}
.vue-liste .ico .col{margin-left:auto;padding-left:10px;white-space:nowrap}
.poignee{position:absolute;right:0;bottom:0;width:16px;height:16px;background:#fff;border-top:2px solid #000;border-left:2px solid #000;cursor:nwse-resize;touch-action:none}
.poignee::after{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;border:2px solid #000}
.fen.max .poignee{display:none}

/* ===== SECTION : Boîtes de dialogue ===== */
.dlg{box-shadow:0 0 0 2px #fff,0 0 0 4px #000,4px 4px 0 4px #000;border:2px solid #000}
.dlg .tb{display:none}
.dlg .corps{padding:14px}
.dlg .haut{display:flex;gap:14px;align-items:flex-start}
.dlg p{margin:0 0 8px;line-height:1.4;user-select:text;-webkit-user-select:text}
.bas{display:flex;gap:10px;justify-content:flex-end;padding-top:12px;flex-wrap:wrap}
.bt{border:2px solid #000;border-radius:8px;background:#fff;padding:3px 14px;min-height:30px;min-width:80px}
.bt:active{background:#000;color:#fff}
.bt.defaut{box-shadow:0 0 0 2px #fff,0 0 0 4px #000}
.fiche dl{margin:8px 0 0;display:grid;grid-template-columns:90px 1fr;gap:4px 8px}
.fiche dd{margin:0;user-select:text;-webkit-user-select:text;word-break:break-word}
.fiche .entete{display:flex;gap:12px;align-items:center;font-weight:bold;font-size:13px;margin-bottom:8px}
.fiche img{display:block;width:100%;border:2px solid #000;margin:8px 0}
.fiche .scroll{max-height:66vh;overflow:auto;padding-right:4px}
.vignettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.vig{background:none;border:0;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;line-height:1.2}
.vig .im{width:100%;aspect-ratio:16/9;background:#fff;border:2px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vig .im img{width:100%;height:100%;object-fit:cover;display:block}
.vig .lib{padding:1px 4px;background:#fff}
.vig.sel .im{outline:3px solid #000}
.vig.sel .lib{background:#000;color:#fff}
.scene{flex:1;display:flex;align-items:center;justify-content:center;background:#000;min-height:0;border-bottom:2px solid #000}
.scene img{max-width:100%;max-height:100%;object-fit:contain}
.legende{padding:4px 8px;font-weight:bold;text-align:center;border-bottom:2px solid #000;flex:none}
.recherche{display:flex;gap:8px;padding:8px;align-items:center;border-bottom:2px solid #000;flex:none}
.recherche input{flex:1;min-height:28px;padding:2px 6px;font:inherit;border:2px solid #000;user-select:text;-webkit-user-select:text;outline:0;background:#fff}
.duel{padding:16px;text-align:center}
.duel p{margin:0 0 10px;line-height:1.4}
.score{height:18px;border:2px solid #000;display:flex;margin:6px 0}
.score i{display:block;height:100%}

/* ===== SECTION : Écrans spéciaux ===== */
#amorce,#arret{position:fixed;inset:0;z-index:200000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#amorce .bj{font:italic 400 clamp(64px,16vw,120px)/1 var(--cursive);margin:6px 0 16px}
#arret{background:#000;color:#fff;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.puces{display:flex;flex-wrap:wrap;gap:4px;margin:6px 6px 2px}
.puce{padding:1px 9px;border-radius:10px;background:#fff;border:1px solid #808080;font-size:11px}
.desc h4{margin:10px 0 4px;font-size:12px}.desc h4:first-child{margin-top:0}
.desc ul{margin:0 0 8px;padding-left:18px}.desc li{line-height:1.4;user-select:text;-webkit-user-select:text}
.vue-liste .ico svg{width:20px;height:20px}

/* ===== SECTION : Habillage « années 2000 » (remplace le style rayé) ===== */
:root{--police:"Lucida Grande","Lucida Sans Unicode",Geneva,Verdana,sans-serif;--bleu1:#6aa7f0;--bleu2:#2f6fd4}
html,body{font-family:var(--police);font-size:12px;
  background:radial-gradient(ellipse at 18% 12%,rgba(255,255,255,.6),rgba(255,255,255,0) 42%),radial-gradient(circle at 82% 78%,rgba(150,205,255,.55),rgba(255,255,255,0) 38%),radial-gradient(circle at 60% 30%,rgba(255,255,255,.18),rgba(255,255,255,0) 20%),linear-gradient(160deg,#1c5aa8 0%,#3b8cd6 48%,#9bcbf2 100%)}
#fond-hello{position:fixed;left:0;right:0;top:24px;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font:italic 400 clamp(110px,24vw,300px)/1 var(--cursive);color:rgba(255,255,255,.93);text-shadow:0 8px 28px rgba(8,45,105,.5);padding-bottom:6vh}
#menus{height:24px;background:linear-gradient(#fcfcfc,#dedede);border-bottom:1px solid #8c8c8c;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mb>button{font-weight:normal;border-radius:4px}
.mb>button.ouvert{background:linear-gradient(var(--bleu1),var(--bleu2));color:#fff}
.liste{border:1px solid #8c8c8c;border-radius:0 0 7px 7px;background:rgba(255,255,255,.97);box-shadow:0 8px 20px rgba(0,0,0,.4);padding:3px 0}
.liste button:hover{background:linear-gradient(var(--bleu1),var(--bleu2));color:#fff}
.liste hr{border-top:1px solid #cfcfcf}
#horloge{font-weight:normal}
/* icônes : pastilles brillantes */
.ico>span:first-child{padding:9px;border-radius:15px;background:linear-gradient(#fff,#d4e1f3);border:1px solid rgba(50,85,140,.6);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 #fff}
.ico .lib{background:none;border:0;color:#fff;text-shadow:0 1px 3px #082a5a;border-radius:10px;padding:1px 9px}
.ico.sel svg{filter:none}
.ico.sel .lib{background:linear-gradient(var(--bleu1),var(--bleu2));color:#fff}
.ico.sel>span:first-child{outline:3px solid rgba(59,127,224,.85)}
.zone .ico .lib{color:#111;text-shadow:none}.zone .ico.sel .lib{color:#fff}
.vue-liste .ico>span:first-child{padding:2px;border-radius:5px;box-shadow:none;border:0;background:none}
.vue-liste .ico.sel{background:linear-gradient(var(--bleu1),var(--bleu2));color:#fff;border-radius:6px}
.vue-liste .ico .lib{color:inherit;text-shadow:none}
/* fenêtres */
.fen{border:1px solid #585858;border-radius:8px 8px 4px 4px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.fen:not(.actif){box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tb{height:26px;border-bottom:1px solid #8a8a8a;background:linear-gradient(rgba(255,255,255,.55),rgba(0,0,0,.07)),repeating-linear-gradient(#e9e9e9 0 2px,#f8f8f8 2px 4px)}
.tb .stries{display:none!important}
.tb .nom{background:none;font-weight:normal;font-size:13px;color:#222;text-shadow:0 1px rgba(255,255,255,.85)}
.tb .case{display:block;top:6px;width:14px;height:14px;padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 -3px 4px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.85)}
.tb .case.ferme{left:9px;background:radial-gradient(circle at 50% 28%,#ffa497,#e0463a)}
.tb .case.zoom{left:49px;right:auto;background:radial-gradient(circle at 50% 28%,#b0eb98,#3aa931)}
.tb::before{content:"";position:absolute;left:29px;top:6px;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.4);background:radial-gradient(circle at 50% 28%,#ffeaa6,#e6b126);box-shadow:inset 0 -3px 4px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.85)}
.fen:not(.actif) .tb .case,.fen:not(.actif) .tb::before{filter:grayscale(1);opacity:.55}
.dlg .tb{display:none}
.infos{border-bottom:1px solid #b9b9b9;background:#f4f4f4}
.recherche{border-bottom:1px solid #b9b9b9}.recherche input{border:1px solid #7f9bc7;border-radius:12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.25);padding:2px 10px}
.legende{border-bottom:1px solid #b9b9b9}.scene{background:#101820;border-bottom:1px solid #b9b9b9}
.poignee{background:none;border:0}.poignee::after{left:auto;top:auto;right:3px;bottom:3px;width:9px;height:9px;border:0;border-right:2px solid #8a8a8a;border-bottom:2px solid #8a8a8a}
/* boîtes de dialogue et boutons */
.dlg{border:1px solid #666;border-radius:11px;background:linear-gradient(#fafafa,#e4e4e4);box-shadow:0 16px 42px rgba(0,0,0,.55)}
.bt{border:1px solid #5f86c6;border-radius:15px;background:linear-gradient(#fff 0,#e6eefb 48%,#cddff5 52%,#e2edfb);padding:3px 18px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.bt:active{background:#a9c4ec;color:#000}
.bt.defaut{background:linear-gradient(#c3dcfc 0,#72a8ee 48%,#3f85e0 52%,#80b6f6);color:#fff;text-shadow:0 -1px rgba(0,0,0,.3);box-shadow:0 1px 3px rgba(0,0,0,.35),0 0 0 3px rgba(80,140,230,.35)}
:focus-visible{outline:2px solid #3b7fe0;outline-offset:2px}
.fiche img{border:1px solid #9aa;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.vig .im{border:1px solid #9aa9be;border-radius:7px;box-shadow:0 2px 7px rgba(0,0,0,.3)}
.vig .lib{background:none;padding:1px 9px;border-radius:10px}
.vig.sel .im{outline:3px solid rgba(59,127,224,.85)}
.vig.sel .lib{background:linear-gradient(var(--bleu1),var(--bleu2));color:#fff}
.score{border:1px solid #7f9bc7;border-radius:9px;overflow:hidden}
/* dock */
#dock{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end;padding:7px 14px;
  background:linear-gradient(rgba(255,255,255,.6),rgba(185,212,244,.5));border:1px solid rgba(255,255,255,.8);border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.4);z-index:90000;max-width:96vw;overflow:visible}
#dock button{background:none;border:0;padding:0;transition:transform .15s}
#dock button:hover,#dock button:focus-visible{transform:translateY(-8px) scale(1.18)}
#dock button>span{padding:5px;border-radius:12px;background:linear-gradient(#fff,#d4e1f3);border:1px solid rgba(50,85,140,.6);box-shadow:0 2px 6px rgba(0,0,0,.35)}
/* écrans de démarrage et d’arrêt */
#amorce{background:linear-gradient(160deg,#1c5aa8,#3b8cd6 55%,#9bcbf2);color:#fff}
#amorce .bj{text-shadow:0 6px 22px rgba(8,45,105,.5)}
#arret{background:linear-gradient(#1b1b1b,#000)}
svg.hello{display:block;overflow:visible;width:min(72vw,880px);height:auto;fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 8px 18px rgba(8,45,105,.5))}
#amorce .bj svg.hello{width:min(70vw,520px);margin:0 auto}
@media (max-width:600px){#dock{gap:4px;padding:5px 8px}#dock button>span{padding:3px}}
/* ===== SECTION : habillage candy (couleurs bonbon façon iMac, arrondis façon macOS récent) ===== */
:root{--rouge:#e5566b;--orange:#f59a3c;--jaune:#f7c948;--vert:#6cc04a;--bleu:#3b82e8;--violet:#9460d0;--turquoise:#26b5cf;
  --arc:linear-gradient(90deg,#e5566b,#f59a3c,#f7c948,#6cc04a,#26b5cf,#3b82e8,#9460d0)}
html,body{background:
  radial-gradient(circle at 8% 10%,rgba(38,181,207,.75),rgba(38,181,207,0) 38%),
  radial-gradient(circle at 92% 8%,rgba(148,96,208,.65),rgba(148,96,208,0) 36%),
  radial-gradient(circle at 6% 92%,rgba(108,192,74,.6),rgba(108,192,74,0) 36%),
  radial-gradient(circle at 94% 90%,rgba(245,154,60,.7),rgba(245,154,60,0) 38%),
  linear-gradient(160deg,#2f6fd6 0%,#4d9bea 50%,#a8d4f6 100%)}
/* grand arc-en-ciel derrière le « hello » */
#fond-hello::before{content:"";position:absolute;left:0;right:0;bottom:0;height:78%;pointer-events:none;opacity:.8;
  background:radial-gradient(circle 62vmin at 50% 112%,transparent 0 60%,#e5566b 60% 67%,#f59a3c 67% 74%,#f7c948 74% 81%,#6cc04a 81% 88%,#3b82e8 88% 95%,#9460d0 95% 102%,transparent 102%)}
#fond-hello svg.hello{position:relative}
/* barre de menus translucide avec filet arc-en-ciel */
#menus{background:rgba(255,255,255,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:0;height:26px}
#menus::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--arc)}
#bureau{top:26px}.mb>button{border-radius:8px;margin:0 1px}
.mb>button.pomme svg{width:24px;height:24px}
.mb>button.ouvert{background:linear-gradient(#78a9f5,#3b82e8)}
.liste{border-radius:0 0 14px 14px;border:0;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(0,0,0,.35);padding:5px}
.liste button{border-radius:8px}
.liste button:hover{background:linear-gradient(#78a9f5,#3b82e8)}
/* icônes : grosses pastilles bonbon, une couleur différente à chaque rang */
.ico>span:first-child{padding:10px;border-radius:24px;border:1px solid rgba(255,255,255,.85);
  box-shadow:inset 0 3px 8px rgba(255,255,255,.85),inset 0 -8px 14px rgba(0,0,0,.14),0 8px 18px rgba(0,0,0,.3);
  background:linear-gradient(#ffffff,#cfe3fb)}
.ico:nth-child(6n+1)>span:first-child,#dock button:nth-child(6n+1)>span{background:linear-gradient(#ffd9de,#f07f92)}
.ico:nth-child(6n+2)>span:first-child,#dock button:nth-child(6n+2)>span{background:linear-gradient(#ffe6c2,#f7a64a)}
.ico:nth-child(6n+3)>span:first-child,#dock button:nth-child(6n+3)>span{background:linear-gradient(#fff3b8,#f3c53a)}
.ico:nth-child(6n+4)>span:first-child,#dock button:nth-child(6n+4)>span{background:linear-gradient(#d8f5bd,#7acb55)}
.ico:nth-child(6n+5)>span:first-child,#dock button:nth-child(6n+5)>span{background:linear-gradient(#c6ecf5,#3cbad3)}
.ico:nth-child(6n+6)>span:first-child,#dock button:nth-child(6n+6)>span{background:linear-gradient(#e2d2f7,#a173d8)}
#disque>span:first-child{background:linear-gradient(#c6ecf5,#3cbad3)}#corbeille>span:first-child{background:linear-gradient(#ececec,#b4b9c4)}
.ico .lib{font-weight:bold;border-radius:12px;padding:1px 10px}
.ico.sel>span:first-child{outline:3px solid #fff}
.ico.sel .lib{background:linear-gradient(#78a9f5,#3b82e8)}
.vue-liste .ico>span:first-child{padding:2px;border-radius:7px;box-shadow:none;border:0;background:none!important}
/* fenêtres très arrondies, filet arc-en-ciel sous la barre de titre */
.fen{border:0;border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.55) inset}
.tb{height:34px;border-bottom:0;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.55))}
.tb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--arc)}
.tb .nom{font-size:14px;font-weight:bold;color:#2a3550}
.tb .case{top:10px;width:15px;height:15px}
.tb .case.ferme{left:14px;background:radial-gradient(circle at 50% 28%,#ff9aa8,#e5566b)}
.tb::before{left:36px;top:10px;width:15px;height:15px;background:radial-gradient(circle at 50% 28%,#ffe48c,#f2b72c)}
.tb .case.zoom{left:58px;background:radial-gradient(circle at 50% 28%,#b7ee9f,#4cb83a)}
.infos{background:rgba(244,247,252,.9);border-bottom:1px solid #d3dbea}
.zone{background:linear-gradient(#ffffff,#f3f7fd)}
.recherche input{border-radius:16px;border-color:#9db8e6}
.poignee::after{border-color:#9aa8c4}
/* boîtes de dialogue et boutons très ronds */
.dlg{border:0;border-radius:24px;background:linear-gradient(#ffffff,#eaf1fb);box-shadow:0 22px 56px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.7) inset}
.dlg::before{content:"";display:block;height:6px;background:var(--arc);border-radius:24px 24px 0 0}

    e.stopPropagation();

  return ouvrirFenetre({

/* Plein écran : les navigateurs l’interdisent sans geste de l’utilisateur(trice) ;
   on le demande donc au premier clic ou à la première touche. Échap pour quitter. */
function basculerPlein() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  } catch (e) { /* plein écran indisponible : on continue sans */ }
}
var pleinTente = false;
function premierGeste() {
  if (pleinTente) return; pleinTente = true;
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } catch (e) { /* ignoré */ }
}

/* Pastilles des mots-clés d’une ressource (texte simple, jamais de HTML). */

  return d;

/* Description longue (texte simple de data-casier.js) : titres, listes et paragraphes. */
function descriptionLongue(parent, it) {
  var ul = null;
  String(it.l || it.x || "").split("\n").forEach(function (ligne) {
    ligne = ligne.trim(); if (!ligne) return;
    if (ligne.indexOf("- ") === 0) { if (!ul) { ul = el("ul"); parent.appendChild(ul); } ul.appendChild(el("li", "", propre(ligne.slice(2)))); return; }
    ul = null;
    if (ligne.indexOf("## ") === 0) parent.appendChild(el("h4", "", propre(ligne.slice(3))));
    else if (/^[←-⯿\uD83C-\uDBFF]/.test(ligne) && ligne.length < 70) parent.appendChild(el("h4", "", propre(ligne)));
    else parent.appendChild(el("p", "", propre(ligne)));
  });
}

/* Galerie : diaporama de tous les aperçus (flèches du clavier, bouton Diaporama pour l’automatique). */
function ouvrirGalerie() {
  var liste = RESSOURCES.filter(function (it) { return it.a; });
  if (!liste.length) { boite("Aucun aperçu n’est disponible.", "info"); return; }
  ouvrirFenetre({

      var i = 0, minuteur = null, scene = el("div", "scene"), img = el("img"), legende = el("div", "legende"), compteur = el("div", "legende");
      scene.appendChild(img);
      /* Affiche l’aperçu numéro n (boucle sans fin). */

        i = (n + liste.length) % liste.length; var it = liste[i];

      function arreter() { if (minuteur) { clearInterval(minuteur); minuteur = null; bPlay.textContent = "Diaporama"; } }
      var bPlay = bouton("bt", "Diaporama", function () {
        if (minuteur) { arreter(); return; }
        minuteur = setInterval(function () { if (fenetres.indexOf(f) < 0) { clearInterval(minuteur); return; } montrer(i + 1); }, 3500); /* ms entre deux aperçus */
        bPlay.textContent = "Pause";
      });
      var bas = el("div", "bas"); bas.style.justifyContent = "center";
      bas.appendChild(bouton("bt", "◀ Précédent", function () { arreter(); montrer(i - 1); }));
      bas.appendChild(bPlay);
      bas.appendChild(bouton("bt", "Suivant ▶", function () { arreter(); montrer(i + 1); }));
      bas.appendChild(bouton("bt", "Fiche…", function () { ouvrirFiche(liste[i]); }));
      corps.appendChild(scene); corps.appendChild(legende); corps.appendChild(compteur); corps.appendChild(bas);
      f.el.setAttribute("tabindex", "-1");
      f.el.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { arreter(); montrer(i + 1); } else if (e.key === "ArrowLeft") { arreter(); montrer(i - 1); }

/* ===== SECTION : Duel Macintosh contre Windows 98 ===== */
/* Lit le score (valeurs bornées, repli à zéro si le stockage est invalide). */
function scoreDuel() {
  try {
    var s = JSON.parse(lire(CLE_DUEL) || "{}");
    return { w: Math.max(0, Math.min(9999, parseInt(s.w, 10) || 0)), m: Math.max(0, Math.min(9999, parseInt(s.m, 10) || 0)) };
  } catch (e) { return { w: 0, m: 0 }; }
}
/* Ouvre la fenêtre du duel. */
function ouvrirDuel() {
  ouvrirFenetre({
    id: "duel", titre: "Duel", l: 400, h: 290, redim: false,
    contenu: function (corps) {
      var cadre = el("div", "duel"), res = el("div"), bas = el("div", "bas"); bas.style.justifyContent = "center";
      cadre.appendChild(el("p", "", "Macintosh contre Windows 98 : qui sera le vainqueur ?"));
      /* Affiche les scores gardés sur cet ordinateur. */
      function montrer() {
        var s = scoreDuel(), total = s.w + s.m; res.textContent = "";
        if (!total) { res.appendChild(el("p", "", "Aucun vote pour l’instant (les votes restent sur cet ordinateur).")); return; }
        res.appendChild(el("p", "", "Macintosh : " + s.m + " vote(s) — Windows 98 : " + s.w + " vote(s)"));
        var b = el("div", "score"), i1 = el("i"), i2 = el("i");
        i1.style.cssText = "background:#000;width:" + Math.round(s.m / total * 100) + "%"; i2.style.cssText = "background:#fff;width:" + Math.round(s.w / total * 100) + "%";
        b.appendChild(i1); b.appendChild(i2); res.appendChild(b);
        res.appendChild(el("p", "", "Noir : Macintosh · Blanc : Windows 98"));
      }
      /* Enregistre un vote puis réagit. */
      function voter(cle) {
        var s = scoreDuel(); s[cle]++; ecrire(CLE_DUEL, JSON.stringify(s)); montrer();
        if (cle === "m") boite("Hello ! Macintosh gagne. Merci pour ton vote.", "info", [{ t: "OK" }, { t: "Voir Windows 98", f: function () { aller("../98/"); } }]);
        else boite("Désolé, une erreur est survenue : Windows 98 a perdu le duel. Le vainqueur est Macintosh.", "bombe", [{ t: "Redémarrer", f: function () { fenetres.slice().forEach(fermer); amorcer(); } }]);
      }
      bas.appendChild(bouton("bt", "Windows 98", function () { voter("w"); }));
      bas.appendChild(bouton("bt defaut", "Macintosh", function () { voter("m"); }));
      cadre.appendChild(res); cadre.appendChild(bas); corps.appendChild(cadre); montrer();
    }
  });
}

var amorceEl = document.getElementById("amorce"), arretEl = document.getElementById("arret"), minuteur = null;
/* Affiche l’écran « hello » puis révèle le bureau. */
function amorcer() {
  arretEl.hidden = true; amorceEl.hidden = false;
  var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  clearTimeout(minuteur); minuteur = setTimeout(finAmorce, reduit ? 600 : 2200);
  amorceEl.focus();
}
/* Termine l’écran de démarrage. */
function finAmorce() { clearTimeout(minuteur); amorceEl.hidden = true; }
amorceEl.addEventListener("click", finAmorce);
amorceEl.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") finAmorce(); });
arretEl.addEventListener("click", amorcer);
arretEl.addEventListener("keydown", function (e) { if (e.key === "Enter") amorcer(); });
