<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fond d’écran « Colline en plein ciel » — dessin original en SVG pur (aucune photo, aucune image existante).
  Auteur : Tom Rougeaud · Réalisé avec l’aide de l’IA : Claude Sonnet 5.5 (Anthropic) · Licence : CC BY-NC 4.0
  Une colline verte, un grand ciel bleu, des nuages doux : composition inventée, volontairement stylisée.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5fc4"/><stop offset=".45" stop-color="#4a93e4"/><stop offset=".78" stop-color="#a8d3f6"/><stop offset="1" stop-color="#d9eefb"/>
    </linearGradient>
    <radialGradient id="soleil" cx=".82" cy=".14" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nuage" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".96"/><stop offset=".6" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="colline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4e866"/><stop offset=".35" stop-color="#6fc443"/><stop offset="1" stop-color="#2f8a2b"/>
    </linearGradient>
    <linearGradient id="avant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58b236"/><stop offset="1" stop-color="#1e6a25"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#ciel)"/>
  <rect width="1920" height="1080" fill="url(#soleil)"/>
  <!-- nuages : ellipses douces superposées -->
  <g>
    <ellipse cx="380" cy="190" rx="300" ry="78" fill="url(#nuage)"/>
    <ellipse cx="250" cy="235" rx="260" ry="70" fill="url(#nuage)"/>
    <ellipse cx="520" cy="250" rx="280" ry="62" fill="url(#nuage)"/>
    <ellipse cx="1180" cy="120" rx="240" ry="48" fill="url(#nuage)"/>
    <ellipse cx="1330" cy="150" rx="210" ry="42" fill="url(#nuage)"/>
    <ellipse cx="1560" cy="330" rx="330" ry="60" fill="url(#nuage)" opacity=".85"/>
    <ellipse cx="1420" cy="372" rx="240" ry="48" fill="url(#nuage)" opacity=".85"/>
    <ellipse cx="760" cy="470" rx="260" ry="36" fill="url(#nuage)" opacity=".7"/>
    <ellipse cx="1000" cy="520" rx="200" ry="28" fill="url(#nuage)" opacity=".6"/>
  </g>
  <!-- crête lointaine, bleutée -->
  <path d="M0 690C260 650 520 700 820 670C1120 640 1480 600 1920 640L1920 1080L0 1080Z" fill="#8fc2a8" opacity=".55"/>
  <!-- grande colline -->
  <path d="M0 770C300 725 700 770 1010 705C1360 632 1700 566 1920 606L1920 1080L0 1080Z" fill="url(#colline)"/>
  <!-- bandes de lumière douce, comme une herbe tondue -->
  <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".13">
    <path d="M60 850C420 790 820 840 1180 760C1500 690 1740 650 1900 676" stroke-width="46"/>
    <path d="M0 930C380 880 800 925 1220 850C1540 792 1760 770 1920 790" stroke-width="38"/>
  </g>
  <!-- colline d’avant-plan -->
  <path d="M0 910C380 838 880 888 1300 946C1600 988 1790 968 1920 944L1920 1080L0 1080Z" fill="url(#avant)"/>
</svg>
